services:
  postgres:
    image: postgres:16-alpine
    container_name: credvidhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credvidhi}
      POSTGRES_USER: ${POSTGRES_USER:-credvidhi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credvidhi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credvidhi -d credvidhi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: credvidhi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: credvidhi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-credvidhi_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-credvidhi_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credvidhi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://credvidhi:credvidhi_dev_password@postgres:5432/credvidhi
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: credvidhi_minio
      MINIO_SECRET_KEY: credvidhi_minio_secret
      MINIO_SECURE: "false"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
    name: credvidhi_postgres_data
  redis_data:
    name: credvidhi_redis_data
  minio_data:
    name: credvidhi_minio_data
